[project]
name = "erpnext_payment_hub"
authors = [
    { name = "ERPNext Payment Hub Contributors" }
]
description = "Provider-agnostic payment gateway router for ERPNext with Tap, MyFatoorah and UPayments adapters."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110
